<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <!-- Concentric rings -->
  <g stroke="#1e3a8a">
    <circle cx="150" cy="150" r="145" stroke-width="1"/>
    <circle cx="150" cy="150" r="118" stroke-width="1.2"/>
    <circle cx="150" cy="150" r="88" stroke-width="1"/>
    <circle cx="150" cy="150" r="52" stroke-width="1.2"/>
  </g>
  <!-- 12 radial spokes -->
  <g stroke="#3b82f6" stroke-width="0.9">
    <path d="M150 150 L295 150"/>
    <path d="M150 150 L275.6 222.5"/>
    <path d="M150 150 L222.5 275.6"/>
    <path d="M150 150 L150 295"/>
    <path d="M150 150 L77.5 275.6"/>
    <path d="M150 150 L24.4 222.5"/>
    <path d="M150 150 L5 150"/>
    <path d="M150 150 L24.4 77.5"/>
    <path d="M150 150 L77.5 24.4"/>
    <path d="M150 150 L150 5"/>
    <path d="M150 150 L222.5 24.4"/>
    <path d="M150 150 L275.6 77.5"/>
  </g>
  <!-- Eight-point stars -->
  <g stroke="#1e3a8a" stroke-width="1.3">
    <rect x="60" y="60" width="180" height="180"/>
    <rect x="60" y="60" width="180" height="180" transform="rotate(45 150 150)"/>
    <rect x="98" y="98" width="104" height="104"/>
    <rect x="98" y="98" width="104" height="104" transform="rotate(45 150 150)"/>
  </g>
  <!-- Petal ring -->
  <g stroke="#3b82f6" stroke-width="1.1">
    <g><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(45 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(90 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(135 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(180 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(225 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(270 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
    <g transform="rotate(315 150 150)"><path d="M150 38 C166 62 166 86 150 104 C134 86 134 62 150 38 Z"/></g>
  </g>
  <!-- Gold centre rosette -->
  <g fill="#d4af37">
    <g><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(45 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(90 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(135 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(180 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(225 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(270 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
    <g transform="rotate(315 150 150)"><ellipse cx="150" cy="122" rx="6" ry="16"/></g>
  </g>
  <circle cx="150" cy="150" r="12" fill="#1e3a8a"/>
  <circle cx="150" cy="150" r="5" fill="#d4af37"/>
</svg>
